<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" fill="#FFFFFF" rx="12" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Title & Context -->
  <text x="36" y="38" fill="#111827" font-size="18" font-weight="700">Frame Execution Lifecycle</text>
  <text x="36" y="58" fill="#6B7280" font-size="13">High-level sequential pipeline executed each frame on the main thread</text>

  <!-- Stage 1: Input -->
  <g transform="translate(36, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="200" height="38" rx="8" fill="#0EA5E9"/>
    <rect y="30" width="200" height="8" fill="#0EA5E9"/>
    <text x="100" y="24" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">1. INPUT</text>
    
    <g transform="translate(16, 56)" font-size="12" fill="#334155">
      <text y="14" font-weight="700" fill="#0369A1">Event Polling</text>
      <text y="30" fill="#64748B">• Capture OS window events</text>
      <text y="46" fill="#64748B">• Keyboard &amp; mouse state</text>
      <text y="62" fill="#64748B">• Handle quit requests</text>
      
      <line x1="0" y1="80" x2="168" y2="80" stroke="#E2E8F0" stroke-width="1"/>
      
      <text y="100" font-weight="700" fill="#0369A1">State Dispatch</text>
      <text y="116" fill="#64748B">• Route input to editor UI</text>
      <text y="132" fill="#64748B">• Update Input Manager</text>
      <text y="148" fill="#64748B">• Dispatch key triggers</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 238 210 L 268 210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Logic & Physics -->
  <g transform="translate(272, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="200" height="38" rx="8" fill="#3B82F6"/>
    <rect y="30" width="200" height="8" fill="#3B82F6"/>
    <text x="100" y="24" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2. LOGIC &amp; SIMULATION</text>
    
    <g transform="translate(16, 56)" font-size="12" fill="#334155">
      <text y="14" font-weight="700" fill="#1D4ED8">Script Execution</text>
      <text y="30" fill="#64748B">• Run gameplay scripts</text>
      <text y="46" fill="#64748B">• Update active game states</text>
      
      <line x1="0" y1="62" x2="168" y2="62" stroke="#E2E8F0" stroke-width="1"/>
      
      <text y="80" font-weight="700" fill="#1D4ED8">Physics Simulation</text>
      <text y="96" fill="#64748B">• Fixed-timestep step</text>
      <text y="112" fill="#64748B">• Resolve body contacts</text>
      
      <line x1="0" y1="126" x2="168" y2="126" stroke="#E2E8F0" stroke-width="1"/>

      <text y="144" font-weight="700" fill="#1D4ED8">Systems Update</text>
      <text y="160" fill="#64748B">• Sync spatial transforms</text>
      <text y="176" fill="#64748B">• Update animation states</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 474 210 L 504 210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Render (Offscreen FBO) -->
  <g transform="translate(508, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="200" height="38" rx="8" fill="#6366F1"/>
    <rect y="30" width="200" height="8" fill="#6366F1"/>
    <text x="100" y="24" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">3. SCENE RENDERING</text>
    
    <g transform="translate(16, 56)" font-size="12" fill="#334155">
      <text y="14" font-weight="700" fill="#4338CA">Target Setup</text>
      <text y="30" fill="#64748B">• Bind offscreen buffer</text>
      <text y="46" fill="#64748B">• Clear color and depth</text>
      
      <line x1="0" y1="62" x2="168" y2="62" stroke="#E2E8F0" stroke-width="1"/>
      
      <text y="80" font-weight="700" fill="#4338CA">Batch Submission</text>
      <text y="96" fill="#64748B">• Layer-sorted 2D sprites</text>
      <text y="112" fill="#64748B">• Geometric primitives</text>
      <text y="128" fill="#64748B">• Font / UI elements</text>
      
      <line x1="0" y1="144" x2="168" y2="144" stroke="#E2E8F0" stroke-width="1"/>

      <text y="162" font-weight="700" fill="#4338CA">Pass Completion</text>
      <text y="178" fill="#64748B">• Flush batches to GPU</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 710 210 L 740 210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Presentation -->
  <g transform="translate(744, 85)" filter="url(#shadow)">
    <rect width="180" height="250" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="180" height="38" rx="8" fill="#10B981"/>
    <rect y="30" width="180" height="8" fill="#10B981"/>
    <text x="90" y="24" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">4. PRESENTATION</text>
    
    <g transform="translate(14, 56)" font-size="12" fill="#334155">
      <text y="14" font-weight="700" fill="#047857">UI &amp; Workspace</text>
      <text y="30" fill="#64748B">• Draw editor overlays</text>
      <text y="46" fill="#64748B">• Scale viewport to fit</text>
      
      <line x1="0" y1="62" x2="152" y2="62" stroke="#E2E8F0" stroke-width="1"/>
      
      <text y="80" font-weight="700" fill="#047857">Display Output</text>
      <text y="96" fill="#64748B">• Blit rendered scene</text>
      <text y="112" fill="#64748B">• Swap hardware buffers</text>
      
      <line x1="0" y1="126" x2="152" y2="126" stroke="#E2E8F0" stroke-width="1"/>

      <text y="144" font-weight="700" fill="#047857">Post-Frame</text>
      <text y="160" fill="#64748B">• Reset staging caches</text>
      <text y="176" fill="#64748B">• Prepare next frame</text>
    </g>
  </g>
</svg>
