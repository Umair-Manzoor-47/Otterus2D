<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B7F"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="498" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <!-- layer labels -->
  <g fill="#6B7785" font-size="12" font-weight="700" letter-spacing="1.5">
    <text x="30" y="70">APPLICATION</text>
    <text x="30" y="180">RUNTIME</text>
    <text x="30" y="300">SUBSYSTEMS</text>
    <text x="30" y="430">FOUNDATION</text>
  </g>

  <!-- Application -->
  <rect x="170" y="30" width="692" height="70" rx="10" fill="#1F3864"/>
  <text x="516" y="60" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">OTTERUS_EDITOR</text>
  <text x="516" y="82" text-anchor="middle" fill="#C9D6EA" font-size="13">Host application and tools</text>

  <!-- Runtime -->
  <rect x="170" y="140" width="692" height="70" rx="10" fill="#2E75B6"/>
  <text x="516" y="170" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">OTTERUS_CORE</text>
  <text x="516" y="192" text-anchor="middle" fill="#E3EEF9" font-size="13">Game logic, entities, assets and scripting</text>

  <!-- Subsystems -->
  <g stroke="#2E75B6" stroke-width="1.5" fill="#EAF1F8">
    <rect x="170" y="250" width="161" height="90" rx="10"/>
    <rect x="347" y="250" width="161" height="90" rx="10"/>
    <rect x="524" y="250" width="161" height="90" rx="10"/>
    <rect x="701" y="250" width="161" height="90" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#1F3864" font-size="15" font-weight="700">
    <text x="250" y="288">WINDOW</text>
    <text x="427" y="288">RENDERING</text>
    <text x="604" y="288">PHYSICS</text>
    <text x="781" y="288">SOUND</text>
  </g>
  <g text-anchor="middle" fill="#4A5868" font-size="12">
    <text x="250" y="312">Windowing</text>
    <text x="250" y="328">and input</text>
    <text x="427" y="312">2D graphics</text>
    <text x="427" y="328">rendering</text>
    <text x="604" y="312">Physics and</text>
    <text x="604" y="328">collisions</text>
    <text x="781" y="312">Audio</text>
    <text x="781" y="328">playback</text>
  </g>

  <!-- Foundation -->
  <g stroke="#8A94A0" stroke-width="1.5" fill="#F3F5F7">
    <rect x="170" y="390" width="338" height="70" rx="10"/>
    <rect x="524" y="390" width="338" height="70" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#1F3864" font-size="15" font-weight="700">
    <text x="339" y="420">LOGGER</text>
    <text x="693" y="420">UTILITIES</text>
  </g>
  <g text-anchor="middle" fill="#4A5868" font-size="12">
    <text x="339" y="441">Engine-wide logging</text>
    <text x="693" y="441">Shared helpers</text>
  </g>

  <!-- arrows -->
  <g stroke="#5B6B7F" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="516" y1="102" x2="516" y2="136"/>
    <line x1="516" y1="212" x2="516" y2="246"/>
    <line x1="516" y1="342" x2="516" y2="386"/>
  </g>
</svg>
